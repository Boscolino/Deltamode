<div class="team-member-card">
    <img src="{{ member.image }}" alt="{{ member.name }}">
    <h3>{{ member.name }}</h3>
    <p class="role">{{ member.role }}</p>
    <p class="bio">{{ member.bio }}</p>
    <p class="skills"><strong>Competenze STEM:</strong> {{ member.skills | join: ", " }}</p>
</div>
